<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مزارع الغيث - الحجز</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#0d3021;
    color:#173b2a;
}

.header{
    background:white;
    height:95px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 25px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:15px;
}

.header-title img{
    width:70px;
    height:70px;
    object-fit:contain;
    border-radius:50%;
}

.header-title h1{
    margin:0;
    color:#28583f;
    font-size:27px;
}

.header-title span{
    display:block;
    color:#a27b2b;
    letter-spacing:4px;
    font-size:14px;
    margin-top:5px;
}

.menu{
    font-size:35px;
    color:#28583f;
}

.page-title{
    color:white;
    text-align:center;
    font-size:28px;
    margin:30px 10px 20px;
}

.calendar-box{
    width:95%;
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:25px;
    padding:20px;
    margin-bottom:50px;
}

.month-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.month-bar button{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#d5ad4e;
    color:#173b2a;
    font-size:28px;
    cursor:pointer;
}

.month-title{
    margin:0;
    color:#28583f;
    font-size:24px;
}

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
}

.weekdays div{
    text-align:center;
    font-weight:bold;
    color:#967127;
    padding:8px 2px;
    font-size:13px;
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.day{
    min-height:145px;
    background:#faf9f5;
    border:2px solid #ddd4c0;
    border-radius:12px;
    padding:7px;
}

.empty{
    visibility:hidden;
}

.day-number{
    font-size:19px;
    font-weight:bold;
    color:#28583f;
    margin-bottom:7px;
}

.shift{
    width:100%;
    border:1px solid #d5ad4e;
    background:white;
    border-radius:9px;
    padding:8px 2px;
    margin-top:5px;
    cursor:pointer;
    color:#173b2a;
    font-weight:bold;
}

.shift:hover{
    background:#f4e8c5;
}

.shift small{
    display:block;
    color:#777;
    margin-top:3px;
    font-weight:normal;
}

.shift.booked{
    background:#ddd;
    border-color:#aaa;
    color:#777;
    cursor:not-allowed;
}

.modal{
    display:none;
    position:fixed;
    z-index:99999;
    inset:0;
    background:rgba(0,0,0,.7);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:450px;
    background:white;
    border-radius:25px;
    padding:25px;
}

.modal-box h2{
    text-align:center;
    color:#28583f;
    margin-top:0;
}

.selected-info{
    background:#f4eddc;
    border-radius:10px;
    padding:13px;
    text-align:center;
    color:#765b22;
    font-weight:bold;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:13px 0 6px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #ddd4c0;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#d5ad4e;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.buttons button{
    flex:1;
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    cursor:pointer;
}

.cancel{
    background:#ddd;
}

.send{
    background:#d5ad4e;
    color:#173b2a;
    font-weight:bold;
}

@media(max-width:600px){

    .header{
        height:90px;
        padding:8px 15px;
    }

    .header-title img{
        width:62px;
        height:62px;
    }

    .header-title h1{
        font-size:22px;
    }

    .header-title span{
        font-size:10px;
        letter-spacing:3px;
    }

    .page-title{
        font-size:24px;
    }

    .calendar-box{
        padding:10px;
        width:96%;
    }

    .weekdays{
        gap:3px;
    }

    .weekdays div{
        font-size:9px;
    }

    .calendar{
        gap:3px;
    }

    .day{
        min-height:115px;
        padding:4px;
    }

    .day-number{
        font-size:15px;
    }

    .shift{
        font-size:10px;
        padding:6px 1px;
    }

    .shift small{
        font-size:8px;
    }

    .month-title{
        font-size:20px;
    }
}

</style>
</head>


<body>


<header class="header">

    <div class="menu">☰</div>

    <div class="header-title">

        <!-- إذا اسم اللوغو عندك Logo-farma.PNG -->
        <img src="Logo-farma.PNG" alt="مزارع الغيث">

        <div>
            <h1>مزارع الغيث</h1>
            <span>ALGAITH FARMS</span>
        </div>

    </div>

</header>


<h2 class="page-title">
    اختر اليوم والشفت المناسب لك
</h2>


<div class="calendar-box">

    <div class="month-bar">

        <button onclick="changeMonth(-1)">‹</button>

        <h2 id="monthTitle" class="month-title"></h2>

        <button onclick="changeMonth(1)">›</button>

    </div>


    <div class="weekdays">

        <div>الأحد</div>
        <div>الاثنين</div>
        <div>الثلاثاء</div>
        <div>الأربعاء</div>
        <div>الخميس</div>
        <div>الجمعة</div>
        <div>السبت</div>

    </div>


    <div id="calendar" class="calendar"></div>

</div>


<!-- نافذة الحجز -->

<div id="modal" class="modal">

    <div class="modal-box">

        <h2>🌿 حجز مزارع الغيث</h2>

        <div id="selectedInfo" class="selected-info"></div>


        <form id="bookingForm">

            <label>الاسم</label>

            <input
                id="name"
                type="text"
                placeholder="اكتب اسمك"
                required
            >


            <label>رقم الهاتف</label>

            <input
                id="phone"
                type="tel"
                placeholder="07XXXXXXXXX"
                required
            >


            <div class="buttons">

                <button
                    type="button"
                    class="cancel"
                    onclick="closeModal()">
                    إلغاء
                </button>

                <button
                    type="submit"
                    class="send">
                    إرسال إلى واتساب
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =====================================================
   رقم واتساب مزارع الغيث
   ===================================================== */

const whatsappNumber = "9647736735730";


/* =====================================================
   المتغيرات
   ===================================================== */

let currentDate = new Date();

let selectedDate = "";
let selectedShift = "";


/* =====================================================
   أسماء الأشهر
   ===================================================== */

const months = [
    "يناير",
    "فبراير",
    "مارس",
    "أبريل",
    "مايو",
    "يونيو",
    "يوليو",
    "أغسطس",
    "سبتمبر",
    "أكتوبر",
    "نوفمبر",
    "ديسمبر"
];


/* =====================================================
   الحجوزات المحلية
   ===================================================== */

let bookings = JSON.parse(
    localStorage.getItem("algaithBookings") || "{}"
);


/* =====================================================
   رسم التقويم
   ===================================================== */

function renderCalendar(){

    const calendar =
        document.getElementById("calendar");

    const monthTitle =
        document.getElementById("monthTitle");

    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    monthTitle.textContent =
        months[month] + " " + year;


    const firstDay =
        new Date(year,month,1).getDay();


    const daysInMonth =
        new Date(year,month + 1,0).getDate();


    /* الأيام الفارغة قبل بداية الشهر */

    for(let i=0;i<firstDay;i++){

        const empty =
            document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);

    }


    /* إنشاء أيام الشهر */

    for(let day=1;day<=daysInMonth;day++){

        const date =
            year + "-" +
            String(month + 1).padStart(2,"0") +
            "-" +
            String(day).padStart(2,"0");


        const dayBox =
            document.createElement("div");

        dayBox.className = "day";


        dayBox.innerHTML = `

            <div class="day-number">
                ${day}
            </div>

            <button
                id="morning-${date}"
                class="shift"
                onclick="selectShift('${date}','شفت صباحي')">

                ☀️ شفت صباحي

                <small>
                    صباحاً
                </small>

            </button>


            <button
                id="evening-${date}"
                class="shift"
                onclick="selectShift('${date}','شفت مسائي')">

                🌙 شفت مسائي

                <small>
                    مساءً
                </small>

            </button>

        `;


        calendar.appendChild(dayBox);


        updateBooked(
            date,
            "شفت صباحي"
        );


        updateBooked(
            date,
            "شفت مسائي"
        );

    }

}


/* =====================================================
   اختيار الشفت
   ===================================================== */

function selectShift(date,shift){

    const key =
        date + "|" + shift;


    if(bookings[key]){

        alert("هذا الشفت محجوز مسبقاً 🔒");

        return;
    }


    selectedDate = date;

    selectedShift = shift;


    document.getElementById("selectedInfo")
        .textContent =
        "📅 " + date + " — " + shift;


    document.getElementById("name").value = "";

    document.getElementById("phone").value = "";


    document.getElementById("modal")
        .classList.add("show");

}


/* =====================================================
   إغلاق النافذة
   ===================================================== */

function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


/* =====================================================
   إرسال الحجز إلى واتساب
   ===================================================== */

document
.getElementById("bookingForm")
.addEventListener("submit",function(event){

    event.preventDefault();


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    if(name === "" || phone === ""){

        alert("يرجى كتابة الاسم ورقم الهاتف");

        return;

    }


    const key =
        selectedDate + "|" + selectedShift;


    /* تسجيل الحجز */

    bookings[key] = {

        name:name,

        phone:phone,

        date:selectedDate,

        shift:selectedShift

    };


    localStorage.setItem(
        "algaithBookings",
        JSON.stringify(bookings)
    );


    /* نص رسالة واتساب */

    const message =
`🌿 طلب حجز جديد - مزارع الغيث

👤 الاسم: ${name}

📱 رقم الهاتف: ${phone}

📅 تاريخ الحجز: ${selectedDate}

🕐 الشفت: ${selectedShift}

شكراً لاختياركم مزارع الغيث ❤️`;


    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);


    closeModal();


    renderCalendar();


    /*
       فتح واتساب
    */

    window.open(
        whatsappURL,
        "_blank"
    );

});


/* =====================================================
   تغيير الشهر
   ===================================================== */

function changeMonth(direction){

    currentDate.setMonth(
        currentDate.getMonth() + direction
    );

    renderCalendar();

}


/* =====================================================
   معرفة الشفت المحجوز
   ===================================================== */

function updateBooked(date,shift){

    const key =
        date + "|" + shift;


    if(!bookings[key]) return;


    let id;


    if(shift === "شفت صباحي"){

        id = "morning-" + date;

    }else{

        id = "evening-" + date;

    }


    const button =
        document.getElementById(id);


    if(button){

        button.disabled = true;

        button.classList.add("booked");

        button.innerHTML =
            "🔒 محجوز" +
            "<small>غير متاح</small>";

    }

}


/* =====================================================
   تشغيل التقويم
   ===================================================== */

renderCalendar();

</script>

</body>
</html>
