<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getFirestore,
    collection,
    doc,
    runTransaction,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBsS6evLb0AX79vzrhYpCAIqwfgBnA05U4",
    authDomain: "alghaith-farms.firebaseapp.com",
    projectId: "alghaith-farms",
    storageBucket: "alghaith-farms.firebasestorage.app",
    messagingSenderId: "247777240312",
    appId: "1:247777240312:web:1d7b4b0a2fba609616870d",
    measurementId: "G-6TRRB1KP4H"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* =========================
   واتساب
========================= */

const whatsappNumber = "9647736735730";


/* =========================
   التاريخ
========================= */

const today = new Date();
today.setHours(0, 0, 0, 0);

let currentDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    1
);


/* =========================
   الحجز الحالي
========================= */

let selectedDate = "";
let selectedShift = "";


/* =========================
   الحجوزات من Firebase
========================= */

let bookedShifts = new Set();


/* =========================
   الأشهر
========================= */

const months = [
    "يناير",
    "فبراير",
    "مارس",
    "أبريل",
    "مايو",
    "يونيو",
    "يوليو",
    "أغسطس",
    "سبتمبر",
    "أكتوبر",
    "نوفمبر",
    "ديسمبر"
];


/* =========================
   فحص الحجز
========================= */

function isShiftBooked(date, shift) {

    return bookedShifts.has(
        `${date}_${shift}`
    );

}


/* =========================
   قراءة الحجوزات
========================= */

function loadBookings() {

    const bookingsRef =
        collection(db, "booking");

    onSnapshot(
        bookingsRef,
        (snapshot) => {

            bookedShifts.clear();

            snapshot.forEach(
                (booking) => {

                    const data =
                        booking.data();

                    if (
                        data.date &&
                        data.shift
                    ) {

                        bookedShifts.add(
                            `${data.date}_${data.shift}`
                        );

                    }

                }
            );

            renderCalendar();

        },
        (error) => {

            console.error(
                "Firebase error:",
                error
            );

        }
    );

}


/* =========================
   حفظ الحجز
========================= */

async function saveBookedShift(
    date,
    shift,
    name,
    phone
) {

    const bookingId =
        `${date}_${shift}`;

    const bookingRef =
        doc(
            db,
            "booking",
            bookingId
        );

    try {

        await runTransaction(
            db,
            async (transaction) => {

                const existing =
                    await transaction.get(
                        bookingRef
                    );

                if (
                    existing.exists()
                ) {

                    throw new Error(
                        "ALREADY_BOOKED"
                    );

                }

                transaction.set(
                    bookingRef,
                    {
                        name: name,
                        phone: phone,
                        date: date,
                        shift: shift,
                        createdAt:
                            serverTimestamp()
                    }
                );

            }
        );

        return true;

    } catch (error) {

        if (
            error.message ===
            "ALREADY_BOOKED"
        ) {

            return false;

        }

        console.error(
            "Save booking error:",
            error
        );

        alert(
            "صار خطأ أثناء حفظ الحجز في Firebase"
        );

        return false;

    }

}


/* =========================
   رسم التقويم
========================= */

function renderCalendar() {

    const calendar =
        document.getElementById(
            "calendar"
        );

    const monthTitle =
        document.getElementById(
            "monthTitle"
        );

    const previousButton =
        document.getElementById(
            "prevMonth"
        );

    calendar.innerHTML = "";

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    monthTitle.textContent =
        months[month] + " " + year;

    const currentMonthStart =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            1
        );

    previousButton.disabled =
        currentDate <=
        currentMonthStart;

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day-box empty-day";

        calendar.appendChild(
            empty
        );

    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const dayBox =
            document.createElement("div");

        dayBox.className =
            "day-box";

        const thisDate =
            new Date(
                year,
                month,
                day
            );

        thisDate.setHours(
            0, 0, 0, 0
        );

        const isPast =
            thisDate < today;

        const isToday =
            thisDate.getTime() ===
            today.getTime();

        const dayNumber =
            document.createElement("div");

        dayNumber.className =
            "day-number";

        dayNumber.textContent =
            day;

        dayBox.appendChild(
            dayNumber
        );


        if (isToday) {

            dayBox.classList.add(
                "today"
            );

            const todayLabel =
                document.createElement("div");

            todayLabel.className =
                "today-label";

            todayLabel.textContent =
                "اليوم";

            dayBox.appendChild(
                todayLabel
            );

        }


        if (isPast) {

            dayBox.classList.add(
                "past-day"
            );

            const locked =
                document.createElement("div");

            locked.className =
                "locked-box";

            locked.innerHTML = `
                <span class="lock-icon">
                    🔒
                </span>
                مغلق
            `;

            dayBox.appendChild(
                locked
            );

        } else {

            const dateKey =
                `${year}-${String(
                    month + 1
                ).padStart(2, "0")}-${String(
                    day
                ).padStart(2, "0")}`;


            /* الصباح */

            const morningButton =
                document.createElement(
                    "button"
                );

            morningButton.className =
                "shift-button";

            if (
                isShiftBooked(
                    dateKey,
                    "شفت صباحي"
                )
            ) {

                morningButton.disabled =
                    true;

                morningButton.innerHTML = `
                    <span class="shift-icon">
                        🔒
                    </span>
                    محجوز
                    <br>
                    <small>
                        شفت صباحي
                    </small>
                `;

            } else {

                morningButton.innerHTML = `
                    <span class="shift-icon">
                        ☀️
                    </span>
                    شفت صباحي
                    <br>
                    <small>
                        صباحاً
                    </small>
                `;

                morningButton.onclick =
                    function () {

                        openBooking(
                            day,
                            year,
                            month,
                            "شفت صباحي"
                        );

                    };

            }


            /* المساء */

            const eveningButton =
                document.createElement(
                    "button"
                );

            eveningButton.className =
                "shift-button";

            if (
                isShiftBooked(
                    dateKey,
                    "شفت مسائي"
                )
            ) {

                eveningButton.disabled =
                    true;

                eveningButton.innerHTML = `
                    <span class="shift-icon">
                        🔒
                    </span>
                    محجوز
                    <br>
                    <small>
                        شفت مسائي
                    </small>
                `;

            } else {

                eveningButton.innerHTML = `
                    <span class="shift-icon">
                        🌙
                    </span>
                    شفت مسائي
                    <br>
                    <small>
                        مساءً
                    </small>
                `;

                eveningButton.onclick =
                    function () {

                        openBooking(
                            day,
                            year,
                            month,
                            "شفت مسائي"
                        );

                    };

            }


            dayBox.appendChild(
                morningButton
            );

            dayBox.appendChild(
                eveningButton
            );

        }

        calendar.appendChild(
            dayBox
        );

    }

}


/* =========================
   تغيير الشهر
========================= */

function changeMonth(direction) {

    const newDate =
        new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() +
                direction,
            1
        );

    const currentMonthStart =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            1
        );

    if (
        newDate <
        currentMonthStart
    ) {

        return;

    }

    currentDate =
        newDate;

    renderCalendar();

}


/* =========================
   فتح الحجز
========================= */

function openBooking(
    day,
    year,
    month,
    shift
) {

    const formattedMonth =
        String(
            month + 1
        ).padStart(2, "0");

    const formattedDay =
        String(day)
        .padStart(2, "0");

    selectedDate =
        `${year}-${formattedMonth}-${formattedDay}`;

    selectedShift =
        shift;


    if (
        isShiftBooked(
            selectedDate,
            selectedShift
        )
    ) {

        alert(
            "هذا الشفت محجوز مسبقاً 🔒"
        );

        renderCalendar();

        return;

    }


    document.getElementById(
        "selectedInfo"
    ).innerHTML = `
        📅 التاريخ:
        ${selectedDate}
        <br>
        ⏰ الفترة:
        ${selectedShift}
    `;


    document.getElementById(
        "bookingModal"
    ).classList.add(
        "show"
    );

}


/* =========================
   إغلاق الحجز
========================= */

function closeModal() {

    document.getElementById(
        "bookingModal"
    ).classList.remove(
        "show"
    );

}


/* =========================
   إرسال الحجز
========================= */

async function sendBooking() {

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();

    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    if (!name) {

        alert(
            "يرجى كتابة الاسم"
        );

        return;

    }


    if (!phone) {

        alert(
            "يرجى كتابة رقم الهاتف"
        );

        return;

    }


    if (
        isShiftBooked(
            selectedDate,
            selectedShift
        )
    ) {

        alert(
            "عذراً، هذا الشفت محجوز مسبقاً 🔒"
        );

        closeModal();

        return;

    }


    /* حفظ أولاً في Firebase */

    const saved =
        await saveBookedShift(
            selectedDate,
            selectedShift,
            name,
            phone
        );


    if (!saved) {

        alert(
            "عذراً، هذا الشفت انحجز قبل قليل 🔒"
        );

        closeModal();

        return;

    }


    /* قفل الشفت فوراً */

    bookedShifts.add(
        `${selectedDate}_${selectedShift}`
    );

    renderCalendar();


    /* واتساب */

    const message =
`🌿 مزارع الغيث
ALGAITH FARMS

📋 طلب حجز جديد

👤 الاسم:
${name}

📱 رقم الهاتف:
${phone}

📅 تاريخ الحجز:
${selectedDate}

⏰ الفترة:
${selectedShift}

شكراً لاختياركم مزارع الغيث 🌿`;


    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        whatsappURL,
        "_blank"
    );


    document.getElementById(
        "customerName"
    ).value = "";

    document.getElementById(
        "customerPhone"
    ).value = "";

    closeModal();

}


/* =========================
   جعل الدوال متاحة للـ HTML
========================= */

window.changeMonth =
    changeMonth;

window.closeModal =
    closeModal;

window.openBooking =
    openBooking;

window.sendBooking =
    sendBooking;


/* =========================
   إغلاق المودال من الخارج
========================= */

document.getElementById(
    "bookingModal"
).addEventListener(
    "click",
    function (event) {

        if (
            event.target === this
        ) {

            closeModal();

        }

    }
);


/* =========================
   تشغيل
========================= */

renderCalendar();

loadBookings();

</script>
