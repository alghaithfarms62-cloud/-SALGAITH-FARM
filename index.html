<script type="module">

/* =========================
   Firebase
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   إعداد Firebase
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyBsS6oevLb0AX79vzrhYpCAIqwfGBnA05U4",

    authDomain: "alghaith-farms.firebaseapp.com",

    projectId: "alghaith-farms",

    storageBucket: "alghaith-farms.firebasestorage.app",

    messagingSenderId: "247777240312",

    appId: "1:247777240312:web:1d7b4b0a2fba609616870d",

    measurementId: "G-6TRRB1KPAH"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   رقم الواتساب
========================= */

const whatsappNumber = "9647736735730";


/* =========================
   التاريخ الحالي
========================= */

const today = new Date();

today.setHours(0, 0, 0, 0);


let currentDate = new Date(
    today.getFullYear(),
    today.getMonth(),
    1
);


/* =========================
   بيانات الحجز
========================= */

let selectedDate = "";

let selectedShift = "";


/* =========================
   الحجوزات الموجودة
========================= */

let bookedShifts = [];


/* =========================
   تحميل الحجوزات من Firebase
========================= */

async function loadBookedShifts() {

    try {

        const snapshot =
            await getDocs(
                collection(db, "booking")
            );

        bookedShifts = [];

        snapshot.forEach((doc) => {

            const data = doc.data();

            if (data.date && data.shift) {

                bookedShifts.push({

                    date: data.date,

                    shift: data.shift

                });

            }

        });

        renderCalendar();

    }

    catch (error) {

        console.error(
            "خطأ في تحميل الحجوزات:",
            error
        );

    }

}


/* =========================
   فحص هل الشفت محجوز
========================= */

function isShiftBooked(date, shift) {

    return bookedShifts.some(
        booking =>
            booking.date === date &&
            booking.shift === shift
    );

}


/* =========================
   حفظ الحجز في Firebase
========================= */

async function saveBookedShift(date, shift) {

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();


    try {

        await addDoc(
            collection(db, "booking"),
            {

                name: name,

                phone: phone,

                date: date,

                shift: shift,

                createdAt: new Date()

            }
        );


        /* إضافة الحجز مباشرة للتقويم */

        bookedShifts.push({

            date: date,

            shift: shift

        });


        return true;

    }

    catch (error) {

        console.error(
            "خطأ في حفظ الحجز:",
            error
        );

        alert(
            "حدث خطأ أثناء حفظ الحجز، حاول مرة ثانية."
        );

        return false;

    }

}


/* =========================
   أسماء الأشهر
========================= */

const months = [

    "يناير",

    "فبراير",

    "مارس",

    "أبريل",

    "مايو",

    "يونيو",

    "يوليو",

    "أغسطس",

    "سبتمبر",

    "أكتوبر",

    "نوفمبر",

    "ديسمبر"

];


/* =========================
   رسم التقويم
========================= */

function renderCalendar() {

    const calendar =
        document.getElementById("calendar");


    const monthTitle =
        document.getElementById("monthTitle");


    const previousButton =
        document.getElementById("prevMonth");


    if (!calendar || !monthTitle) {

        return;

    }


    calendar.innerHTML = "";


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    monthTitle.textContent =
        months[month] + " " + year;


    const currentMonthStart =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            1
        );


    if (previousButton) {

        previousButton.disabled =
            currentDate <= currentMonthStart;

    }


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    /* =========================
       الخانات الفارغة
    ========================= */

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");


        empty.className =
            "day-box empty-day";


        calendar.appendChild(empty);

    }


    /* =========================
       الأيام
    ========================= */

    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const dayBox =
            document.createElement("div");


        dayBox.className =
            "day-box";


        const thisDate =
            new Date(
                year,
                month,
                day
            );


        thisDate.setHours(
            0,
            0,
            0,
            0
        );


        const isPast =
            thisDate < today;


        const isToday =
            thisDate.getTime() ===
            today.getTime();


        const dayNumber =
            document.createElement("div");


        dayNumber.className =
            "day-number";


        dayNumber.textContent =
            day;


        dayBox.appendChild(dayNumber);


        /* =========================
           اليوم الحالي
        ========================= */

        if (isToday) {

            dayBox.classList.add("today");


            const todayLabel =
                document.createElement("div");


            todayLabel.className =
                "today-label";


            todayLabel.textContent =
                "اليوم";


            dayBox.appendChild(
                todayLabel
            );

        }


        /* =========================
           الأيام الماضية
        ========================= */

        if (isPast) {

            dayBox.classList.add(
                "past-day"
            );


            const locked =
                document.createElement("div");


            locked.className =
                "locked-box";


            locked.innerHTML = `

                <span class="lock-icon">
                    🔒
                </span>

                مغلق

            `;


            dayBox.appendChild(locked);

        }


        /* =========================
           الأيام المتاحة
        ========================= */

        else {

            const dateKey =
                `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;


            /* =========================
               الشفت الصباحي
            ========================= */

            const morningButton =
                document.createElement("button");


            morningButton.className =
                "shift-button";


            if (
                isShiftBooked(
                    dateKey,
                    "شفت صباحي"
                )
            ) {

                morningButton.disabled =
                    true;


                morningButton.innerHTML = `

                    <span class="shift-icon">
                        🔒
                    </span>

                    محجوز

                    <br>

                    <small>
                        شفت صباحي
                    </small>

                `;

            }

            else {

                morningButton.innerHTML = `

                    <span class="shift-icon">
                        ☀️
                    </span>

                    شفت صباحي

                    <br>

                    <small>
                        صباحاً
                    </small>

                `;


                morningButton.onclick =
                    function () {

                        openBooking(
                            day,
                            year,
                            month,
                            "شفت صباحي"
                        );

                    };

            }


            /* =========================
               الشفت المسائي
            ========================= */

            const eveningButton =
                document.createElement("button");


            eveningButton.className =
                "shift-button";


            if (
                isShiftBooked(
                    dateKey,
                    "شفت مسائي"
                )
            ) {

                eveningButton.disabled =
                    true;


                eveningButton.innerHTML = `

                    <span class="shift-icon">
                        🔒
                    </span>

                    محجوز

                    <br>

                    <small>
                        شفت مسائي
                    </small>

                `;

            }

            else {

                eveningButton.innerHTML = `

                    <span class="shift-icon">
                        🌙
                    </span>

                    شفت مسائي

                    <br>

                    <small>
                        مساءً
                    </small>

                `;


                eveningButton.onclick =
                    function () {

                        openBooking(
                            day,
                            year,
                            month,
                            "شفت مسائي"
                        );

                    };

            }


            dayBox.appendChild(
                morningButton
            );


            dayBox.appendChild(
                eveningButton
            );

        }


        calendar.appendChild(dayBox);

    }

}


/* =========================
   تغيير الشهر
========================= */

window.changeMonth =
function (direction) {

    const newDate =
        new Date(
            currentDate.getFullYear(),
            currentDate.getMonth() + direction,
            1
        );


    const currentMonthStart =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            1
        );


    if (
        newDate <
        currentMonthStart
    ) {

        return;

    }


    currentDate =
        newDate;


    renderCalendar();

};


/* =========================
   فتح نافذة الحجز
========================= */

window.openBooking =
function (
    day,
    year,
    month,
    shift
) {

    const formattedMonth =
        String(month + 1)
        .padStart(2, "0");


    const formattedDay =
        String(day)
        .padStart(2, "0");


    selectedDate =
        `${year}-${formattedMonth}-${formattedDay}`;


    selectedShift =
        shift;


    if (
        isShiftBooked(
            selectedDate,
            selectedShift
        )
    ) {

        alert(
            "هذا الشفت محجوز مسبقاً 🔒"
        );


        renderCalendar();

        return;

    }


    document.getElementById(
        "selectedInfo"
    ).innerHTML = `

        📅 التاريخ:
        ${selectedDate}

        <br>

        ⏰ الفترة:
        ${selectedShift}

    `;


    document.getElementById(
        "bookingModal"
    ).classList.add("show");

};


/* =========================
   إغلاق نافذة الحجز
========================= */

window.closeModal =
function () {

    document.getElementById(
        "bookingModal"
    ).classList.remove("show");

};


/* =========================
   إرسال الحجز
========================= */

window.sendBooking =
async function () {

    const name =
        document
        .getElementById("customerName")
        .value
        .trim();


    const phone =
        document
        .getElementById("customerPhone")
        .value
        .trim();


    if (!name) {

        alert(
            "يرجى كتابة الاسم"
        );

        return;

    }


    if (!phone) {

        alert(
            "يرجى كتابة رقم الهاتف"
        );

        return;

    }


    if (
        !selectedDate ||
        !selectedShift
    ) {

        alert(
            "يرجى اختيار اليوم والشفت أولاً"
        );

        return;

    }


    /* =========================
       منع الحجز المكرر
    ========================= */

    if (
        isShiftBooked(
            selectedDate,
            selectedShift
        )
    ) {

        alert(
            "عذراً، هذا الشفت محجوز مسبقاً 🔒"
        );


        closeModal();

        renderCalendar();

        return;

    }


    /* =========================
       حفظ الحجز أولاً
    ========================= */

    const saved =
        await saveBookedShift(
            selectedDate,
            selectedShift
        );


    if (!saved) {

        return;

    }


    /* =========================
       رسالة واتساب
    ========================= */

    const message = `

🌿 مزارع الغيث
ALGAITH FARMS

📋 طلب حجز جديد

👤 الاسم:
${name}

📱 رقم الهاتف:
${phone}

📅 تاريخ الحجز:
${selectedDate}

⏰ الفترة:
${selectedShift}

شكراً لاختياركم مزارع الغيث 🌿

`;


    const whatsappURL =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);


    /* =========================
       تحديث التقويم
    ========================= */

    renderCalendar();


    /* =========================
       فتح واتساب
    ========================= */

    window.open(
        whatsappURL,
        "_blank"
    );


    /* =========================
       تنظيف النموذج
    ========================= */

    document.getElementById(
        "customerName"
    ).value = "";


    document.getElementById(
        "customerPhone"
    ).value = "";


    closeModal();

};


/* =========================
   إغلاق عند الضغط خارج النافذة
========================= */

const bookingModal =
    document.getElementById(
        "bookingModal"
    );


if (bookingModal) {

    bookingModal.addEventListener(
        "click",
        function (event) {

            if (
                event.target === this
            ) {

                closeModal();

            }

        }
    );

}


/* =========================
   تشغيل الموقع
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        renderCalendar();

        loadBookedShifts();

    }
);

</script>
