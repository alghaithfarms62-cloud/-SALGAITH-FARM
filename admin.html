<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>إدارة حجوزات مزارع الغيث</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   GENERAL
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f5eef1;
    color:#241d22;
}

/* =========================
   LOGIN
========================= */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:22px;
    border:2px solid #dfcbd2;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
    text-align:center;
}

.login-logo{
    font-size:50px;
    margin-bottom:10px;
}

.login-box h1{
    color:#704052;
    margin-bottom:8px;
}

.login-box p{
    color:#777;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:13px;
    border:2px solid #dfcbd2;
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    outline:none;
}

.login-box input:focus{
    border-color:#a35f77;
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#704052;
    color:#fff;
    font-family:inherit;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.login-btn:hover{
    background:#59313f;
}

.login-error{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:#f8d7da;
    color:#842029;
    font-size:14px;
}

.login-error.show{
    display:block;
}

/* =========================
   ADMIN
========================= */

#adminPage{
    display:none;
}

header{
    background:#171318;
    color:#fff;
    padding:22px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

header h1{
    color:#e2a4b7;
    margin-bottom:6px;
}

header p{
    color:#ddd;
}

.logout-btn{
    background:#c62828;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:11px 18px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.logout-btn:hover{
    background:#a51f1f;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:94%;
    max-width:1300px;
    margin:30px auto;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#fff;
    border:2px solid #dfcbd2;
    border-radius:18px;
    padding:22px;
    text-align:center;
    box-shadow:0 6px 20px rgba(0,0,0,.07);
}

.stat h3{
    color:#704052;
    margin-bottom:8px;
}

.stat strong{
    font-size:28px;
    color:#a35f77;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;
    margin-bottom:15px;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
}

.message.show{
    display:block;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

/* =========================
   FILTERS
========================= */

.filters{
    background:#fff;
    border:2px solid #dfcbd2;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;

    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.filters input,
.filters select{
    width:100%;
    padding:12px;
    border:2px solid #dfcbd2;
    border-radius:10px;
    font-family:inherit;
    outline:none;
}

.filters input:focus,
.filters select:focus{
    border-color:#a35f77;
}

.refresh{
    background:#704052;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:12px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   TABLE
========================= */

.table-box{
    background:#fff;
    border-radius:18px;
    border:2px solid #dfcbd2;
    overflow:auto;
    box-shadow:0 6px 20px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#211b20;
    color:#e2a4b7;
    padding:15px;
    white-space:nowrap;
}

td{
    padding:13px;
    border-bottom:1px solid #eee;
    text-align:center;
}

tr:hover{
    background:#fff7fa;
}

.price{
    color:#a35f77;
    font-weight:bold;
}

.delete-btn{
    background:#c62828;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:8px 13px;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn:hover{
    background:#a51f1f;
}

.empty{
    text-align:center;
    padding:40px;
    color:#777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:1fr;
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    header{
        flex-direction:column;
        text-align:center;
    }

}

@media(max-width:500px){

    .filters{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            🌿
        </div>

        <h1>
            مزارع الغيث
        </h1>

        <p>
            تسجيل دخول الإدارة
        </p>

        <input
            id="email"
            type="email"
            placeholder="البريد الإلكتروني"
            autocomplete="email"
        >

        <input
            id="password"
            type="password"
            placeholder="كلمة المرور"
            autocomplete="current-password"
        >

        <button
            class="login-btn"
            onclick="login()"
        >
            تسجيل الدخول
        </button>

        <div
            id="loginError"
            class="login-error"
        ></div>

    </div>

</div>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div id="adminPage">

    <header>

        <div>

            <h1>
                📋 إدارة حجوزات مزارع الغيث
            </h1>

            <p>
                لوحة التحكم بالحجوزات
            </p>

        </div>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            تسجيل خروج
        </button>

    </header>


    <div class="container">


        <!-- =========================
             STATS
        ========================= -->

        <div class="stats">

            <div class="stat">

                <h3>
                    عدد الحجوزات
                </h3>

                <strong id="bookingCount">
                    0
                </strong>

            </div>


            <div class="stat">

                <h3>
                    قيمة الحجوزات
                </h3>

                <strong id="totalAmount">
                    0 د.ع
                </strong>

            </div>


            <div class="stat">

                <h3>
                    آخر تحديث
                </h3>

                <strong
                    id="lastUpdate"
                    style="font-size:18px"
                >
                    -
                </strong>

            </div>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =========================
             FILTERS
        ========================= -->

        <div class="filters">

            <input
                id="search"
                type="text"
                placeholder="🔎 الاسم أو رقم الهاتف"
                oninput="renderTable()"
            >


            <input
                id="dateFilter"
                type="date"
                onchange="renderTable()"
            >


            <select
                id="farmFilter"
                onchange="renderTable()"
            >

                <option value="">
                    كل المزارع
                </option>

                <option value="المزرعة الأولى">
                    المزرعة الأولى
                </option>

                <option value="المزرعة الثانية">
                    المزرعة الثانية
                </option>

            </select>


            <select
                id="shiftFilter"
                onchange="renderTable()"
            >

                <option value="">
                    كل الشفتات
                </option>

                <option value="شفت صباحي">
                    ☀️ شفت صباحي
                </option>

                <option value="شفت مسائي">
                    🌙 شفت مسائي
                </option>

            </select>


            <button
                class="refresh"
                onclick="loadBookings()"
            >
                🔄 تحديث
            </button>

        </div>


        <!-- =========================
             BOOKINGS TABLE
        ========================= -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            التاريخ
                        </th>

                        <th>
                            المزرعة
                        </th>

                        <th>
                            الشفت
                        </th>

                        <th>
                            الاسم
                        </th>

                        <th>
                            رقم الهاتف
                        </th>

                        <th>
                            السعر
                        </th>

                        <th>
                            إلغاء
                        </th>

                    </tr>

                </thead>


                <tbody id="bookingTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xhyuqruymtengguoyaie.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_v_vOawF0sNtyj2YavPT6xw_u_zESPoI";


const BOOKINGS_TABLE =
    "BookingFarms";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let bookings = [];


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const errorBox =
        document.getElementById(
            "loginError"
        );


    errorBox.className =
        "login-error";


    if(!email || !password){

        errorBox.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        errorBox.className =
            "login-error show";

        return;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            errorBox.textContent =
                error.message ||
                "بيانات الدخول غير صحيحة.";

            errorBox.className =
                "login-error show";

            return;

        }


        if(
            !data ||
            !data.session
        ){

            errorBox.textContent =
                "لم يتم إنشاء جلسة دخول.";

            errorBox.className =
                "login-error show";

            return;

        }


        showAdmin();

    }

    catch(error){

        console.error(error);

        errorBox.textContent =
            "حدث خطأ أثناء تسجيل الدخول.";

        errorBox.className =
            "login-error show";

    }

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
            .getSession();


        if(error){

            console.error(error);

            showLogin();

            return;

        }


        if(
            data &&
            data.session
        ){

            showAdmin();

        }
        else{

            showLogin();

        }

    }

    catch(error){

        console.error(error);

        showLogin();

    }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    document.getElementById(
        "loginPage"
    ).style.display =
        "flex";


    document.getElementById(
        "adminPage"
    ).style.display =
        "none";

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

    document.getElementById(
        "loginPage"
    ).style.display =
        "none";


    document.getElementById(
        "adminPage"
    ).style.display =
        "block";


    loadBookings();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    bookings = [];

    showLogin();

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message show " +
        type;


    setTimeout(
        function(){

            box.className =
                "message";

        },
        3000
    );

}


/* =====================================================
   LOAD BOOKINGS
===================================================== */

async function loadBookings(){

    const {
        data,
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .select("*")
        .order(
            "booking_date",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        showMessage(
            "حدث خطأ أثناء تحميل الحجوزات: " +
            error.message,
            "error"
        );

        return;

    }


    bookings =
        data || [];


    renderTable();

    updateStats();


    document.getElementById(
        "lastUpdate"
    ).textContent =
        new Date().toLocaleTimeString(
            "ar-IQ"
        );

}


/* =====================================================
   GET CUSTOMER NAME
===================================================== */

function getCustomerName(
    booking
){

    return (
        booking["Customer name"] ||
        booking["customer_name"] ||
        ""
    );

}


/* =====================================================
   GET FARM
===================================================== */

function getFarm(
    booking
){

    return (
        booking["Farm"] ||
        booking["farm"] ||
        ""
    );

}


/* =====================================================
   GET SHIFT
===================================================== */

function getShift(
    booking
){

    return (
        booking["Shift"] ||
        booking["shift"] ||
        ""
    );

}


/* =====================================================
   PRICE
===================================================== */

function getPrice(
    date,
    shift
){

    if(!date){

        return 0;

    }


    const parts =
        String(date).split("-");


    const dateObject =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    const day =
        dateObject.getDay();


    /*
        الخميس = 4
        الجمعة = 5
        السبت = 6
    */

    const expensiveDays =
        day === 4 ||
        day === 5 ||
        day === 6;


    if(expensiveDays){

        if(
            shift ===
            "شفت صباحي"
        ){

            return 350000;

        }


        if(
            shift ===
            "شفت مسائي"
        ){

            return 400000;

        }

    }


    if(
        shift ===
        "شفت صباحي"
    ){

        return 250000;

    }


    if(
        shift ===
        "شفت مسائي"
    ){

        return 300000;

    }


    return 0;

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
    price
){

    return (
        Number(price)
        .toLocaleString("en-US")
        +
        " د.ع"
    );

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

    const tbody =
        document.getElementById(
            "bookingTable"
        );


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const date =
        document
        .getElementById("dateFilter")
        .value;


    const farm =
        document
        .getElementById("farmFilter")
        .value;


    const shift =
        document
        .getElementById("shiftFilter")
        .value;


    const filtered =
        bookings.filter(
            function(booking){

                const name =
                    getCustomerName(
                        booking
                    )
                    .toLowerCase();


                const phone =
                    String(
                        booking.customer_phone || ""
                    )
                    .toLowerCase();


                const bookingFarm =
                    getFarm(
                        booking
                    );


                const bookingShift =
                    getShift(
                        booking
                    );


                const matchSearch =
                    !search ||
                    name.includes(search) ||
                    phone.includes(search);


                const matchDate =
                    !date ||
                    booking.booking_date === date;


                const matchFarm =
                    !farm ||
                    bookingFarm === farm;


                const matchShift =
                    !shift ||
                    bookingShift === shift;


                return (
                    matchSearch &&
                    matchDate &&
                    matchFarm &&
                    matchShift
                );

            }
        );


    tbody.innerHTML = "";


    if(
        filtered.length === 0
    ){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    لا توجد حجوزات
                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach(
        function(
            booking,
            index
        ){

            const bookingShift =
                getShift(
                    booking
                );


            const price =
                getPrice(
                    booking.booking_date,
                    bookingShift
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${booking.booking_date || "-"}
                </td>

                <td>
                    ${getFarm(booking) || "-"}
                </td>

                <td>
                    ${
                        bookingShift ===
                        "شفت صباحي"

                        ? "☀️ صباحي"

                        : "🌙 مسائي"
                    }
                </td>

                <td>
                    ${getCustomerName(booking) || "-"}
                </td>

                <td>
                    ${booking.customer_phone || "-"}
                </td>

                <td class="price">
                    ${formatPrice(price)}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="cancelBooking('${booking.id}')"
                    >
                        إلغاء الحجز
                    </button>

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "bookingCount"
    ).textContent =
        bookings.length;


    let total = 0;


    bookings.forEach(
        function(booking){

            total +=
                getPrice(
                    booking.booking_date,
                    getShift(booking)
                );

        }
    );


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatPrice(total);

}


/* =====================================================
   CANCEL BOOKING
===================================================== */

async function cancelBooking(
    id
){

    const booking =
        bookings.find(
            function(item){

                return String(
                    item.id
                ) === String(id);

            }
        );


    if(!booking){

        alert(
            "لم يتم العثور على الحجز."
        );

        return;

    }


    const name =
        getCustomerName(
            booking
        );


    const farm =
        getFarm(
            booking
        );


    const shift =
        getShift(
            booking
        );


    const confirmed =
        confirm(

`هل أنت متأكد من إلغاء الحجز؟

الاسم:
${name}

المزرعة:
${farm}

التاريخ:
${booking.booking_date}

الشفت:
${shift}`

        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        console.error(
            "DELETE ERROR:",
            error
        );

        showMessage(
            "فشل إلغاء الحجز: " +
            error.message,
            "error"
        );

        return;

    }


    bookings =
        bookings.filter(
            function(item){

                return String(
                    item.id
                ) !== String(id);

            }
        );


    renderTable();

    updateStats();


    showMessage(
        "تم إلغاء الحجز بنجاح ✅",
        "success"
    );

}


/* =====================================================
   START
===================================================== */

checkSession();

</script>

</body>

</html>
