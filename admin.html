<style>

/* =====================================================
   ALGAITH FARMS - LUXURY ADMIN
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --black:#080808;
    --black2:#101010;
    --card:#151515;
    --card2:#1b1b1b;
    --gold:#d4af37;
    --gold2:#f0d477;
    --gold-dark:#9d7b16;
    --white:#f7f7f7;
    --gray:#a7a7a7;
    --border:rgba(212,175,55,.22);
    --red:#b52a2a;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.09),
            transparent 35%
        ),
        #080808;
    color:var(--white);
    min-height:100vh;
}

/* =====================================================
   LOGIN
===================================================== */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,.12),
            transparent 45%
        ),
        #080808;
}

.login-box{
    width:100%;
    max-width:430px;

    background:
        linear-gradient(
            145deg,
            #1b1b1b,
            #0d0d0d
        );

    border-radius:26px;

    border:1px solid var(--border);

    box-shadow:
        0 25px 70px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.04);

    text-align:center;
}

.login-logo{
    width:82px;
    height:82px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid var(--gold);

    background:#090909;

    font-size:40px;

    box-shadow:
        0 0 35px rgba(212,175,55,.18);
}

.login-box h1{
    color:var(--gold2);
    margin-bottom:8px;
    font-size:26px;
}

.login-box p{
    color:var(--gray);
    margin-bottom:28px;
}

.login-box input{
    width:100%;

    padding:15px;

    margin-bottom:13px;

    background:#0b0b0b;

    color:#fff;

    border:1px solid #333;

    border-radius:12px;

    font-family:inherit;
    font-size:15px;

    outline:none;

    transition:.25s;
}

.login-box input:focus{
    border-color:var(--gold);

    box-shadow:
        0 0 0 3px rgba(212,175,55,.08);
}

.login-btn{

    padding:15px;

    border-radius:12px;

    font-family:inherit;

    transition:.25s;
}

.login-btn:hover{

}

    display:none;

    padding:12px;

    border-radius:10px;

    border:1px solid #713030;

}

.login-error.show{

}

/* =====================================================
   ADMIN
===================================================== */

#adminPage{
    display:none;
}

/* =====================================================
   HEADER
===================================================== */

header{

header p{

.header-buttons{

.notification-btn,

/* =====================================================
   CONTAINER
===================================================== */

/* =====================================================
   STATS
===================================================== */

.stats{

.stat{

.stat::before{

    position:absolute;

    top:-50px;
    right:-50px;

    height:120px;

        radial-gradient(
            circle,
            rgba(212,175,55,.14),
            transparent 70%

}

.stat h3{

    margin-bottom:10px;

    font-size:14px;
}

.stat strong{

    color:var(--gold2);
}

/* =====================================================
   MESSAGE
===================================================== */

.message{

    margin-bottom:15px;

    padding:14px;

    border-radius:12px;

}

.message.show{

}

.success{

}

.error{

/* =====================================================
   FILTERS
===================================================== */

}

.modal-buttons{

.save-edit{

</style>

</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xhyuqruymtengguoyaie.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_v_vOawF0sNtyj2YavPT6xw_u_zESPoI";

const BOOKINGS_TABLE =
    "BookingFarms";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let bookings = [];

let realtimeChannel = null;

let editingBookingId = null;

let audioContext = null;


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const errorBox =
        document.getElementById(
            "loginError"
        );

    errorBox.className =
        "login-error";


    if(!email || !password){

        errorBox.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        errorBox.className =
            "login-error show";

        return;
    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            errorBox.textContent =
                error.message ||
                "بيانات الدخول غير صحيحة.";

            errorBox.className =
                "login-error show";

            return;
        }


        if(
            !data ||
            !data.session
        ){

            errorBox.textContent =
                "لم يتم إنشاء جلسة دخول.";

            errorBox.className =
                "login-error show";

            return;
        }


        initAudio();

        showAdmin();

    }

    catch(error){

        console.error(error);

        errorBox.textContent =
            "حدث خطأ أثناء تسجيل الدخول.";

        errorBox.className =
            "login-error show";

    }

}

/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

    try{

        if(!audioContext){

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if(AudioContext){

                audioContext =
                    new AudioContext();

            }
        }


        if(
            audioContext &&
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }

    catch(error){

        console.log(
            "Audio unavailable",
            error
        );

    }

}


function playNotificationSound(){

    try{

        if(!audioContext){

            initAudio();

        }


        if(!audioContext){

            return;

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            880,
            now
        );


        oscillator.frequency.setValueAtTime(
            660,
            now + 0.15
        );


        oscillator.frequency.setValueAtTime(
            880,
            now + 0.30
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            0.25,
            now + 0.03
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.50
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start(now);

        oscillator.stop(
            now + 0.55
        );

    }

    catch(error){

        console.log(
            "Sound error:",
            error
        );

    }

}

/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

    if(realtimeChannel){

        return;
    }


    realtimeChannel =
        supabaseClient
        .channel(
            "bookingfarms-realtime"
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:BOOKINGS_TABLE
            },
            function(payload){

                console.log(
                    "NEW BOOKING:",
                    payload
                );


                const exists =
                    bookings.some(
                        function(item){

                            return String(
                                item.id
                            ) === String(
                                payload.new.id
                            );

                        }
                    );


                if(!exists){

                    bookings.push(
                        payload.new
                    );

                }


                renderTable();

                updateStats();

                updateLastUpdate();

                notifyNewBooking(
                    payload.new
                );

            }
        )
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:BOOKINGS_TABLE
            },
            function(payload){

                const index =
                    bookings.findIndex(
                        function(item){

                            return String(
                                item.id
                            ) === String(
                                payload.new.id
                            );

                        }
                    );


                if(index !== -1){

                    bookings[index] =
                        payload.new;

                }
                else{

                    bookings.push(
                        payload.new
                    );

                }


                renderTable();

                updateStats();

                updateLastUpdate();


                showMessage(
                    "✏️ تم تحديث الحجز",
                    "success"
                );

            }
        )
        .on(
            "postgres_changes",
            {
                event:"DELETE",
                schema:"public",
                table:BOOKINGS_TABLE
            },
            function(payload){

                bookings =
                    bookings.filter(
                        function(item){

                            return String(
                                item.id
                            ) !== String(
                                payload.old.id
                            );

                        }
                    );


                renderTable();

                updateStats();

                updateLastUpdate();


                showMessage(
                    "🗑️ تم إلغاء حجز",
                    "success"
                );

            }
        )
        .subscribe(
            function(status){

                console.log(
                    "Realtime status:",
                    status
                );

            }
        );

}

/* =====================================================
   GET NAME
===================================================== */

function getCustomerName(
    booking
){

    return (
        booking["Customer name"] ||
        booking["customer_name"] ||
        ""
    );

}


/* =====================================================
   GET FARM
===================================================== */

function getFarm(
    booking
){

    return (
        booking["Farm"] ||
        booking["farm"] ||
        ""
    );

}


/* =====================================================
   GET SHIFT
===================================================== */

function getShift(
    booking
){

    return (
        booking["Shift"] ||
        booking["shift"] ||
        ""
    );

}


/* =====================================================
   PRICE
===================================================== */

function getPrice(
    date,
    shift
){

    if(!date){

        return 0;

    }


    const parts =
        String(date).split("-");


    const dateObject =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    const day =
        dateObject.getDay();


    const expensiveDays =
        day === 4 ||
        day === 5 ||
        day === 6;


    if(expensiveDays){

        if(
            shift ===
            "شفت صباحي"
        ){

            return 350000;

        }


        if(
            shift ===
            "شفت مسائي"
        ){

            return 400000;

        }

    }


    if(
        shift ===
        "شفت صباحي"
    ){

        return 250000;

    }


    if(
        shift ===
        "شفت مسائي"
    ){

        return 300000;

    }


    return 0;

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
    price
){

    return (
        Number(price)
        .toLocaleString("en-US")
        +
        " د.ع"
    );

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

    const tbody =
        document.getElementById(
            "bookingTable"
        );


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const date =
        document
        .getElementById("dateFilter")
        .value;


    const farm =
        document
        .getElementById("farmFilter")
        .value;


    const shift =
        document
        .getElementById("shiftFilter")
        .value;


    const filtered =
        bookings.filter(
            function(booking){

                const name =
                    getCustomerName(
                        booking
                    )
                    .toLowerCase();


                const phone =
                    String(
                        booking.customer_phone || ""
                    )
                    .toLowerCase();


                const bookingFarm =
                    getFarm(
                        booking
                    );


                const bookingShift =
                    getShift(
                        booking
                    );


                return (

                    (!search ||
                    name.includes(search) ||
                    phone.includes(search))

                    &&

                    (!date ||
                    booking.booking_date === date)

                    &&

                    (!farm ||
                    bookingFarm === farm)

                    &&

                    (!shift ||
                    bookingShift === shift)

                );

            }
        );


    tbody.innerHTML = "";


    if(
        filtered.length === 0
    ){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    لا توجد حجوزات
                </td>

            </tr>

        `;

        return;
    }


    filtered.sort(
        function(a,b){

            return String(
                b.created_at || ""
            ).localeCompare(
                String(
                    a.created_at || ""
                )
            );

        }
    );


    filtered.forEach(
        function(
            booking,
            index
        ){

            const bookingShift =
                getShift(
                    booking
                );


            const price =
                getPrice(
                    booking.booking_date,
                    bookingShift
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${booking.booking_date || "-"}
                </td>

                <td>
                    ${getFarm(booking) || "-"}
                </td>

                <td>
                    ${
                        bookingShift ===
                        "شفت صباحي"

                        ? "☀️ صباحي"

                        : "🌙 مسائي"
                    }
                </td>

                <td>
                    ${getCustomerName(booking) || "-"}
                </td>

                <td>
                    ${booking.customer_phone || "-"}
                </td>

                <td class="price">
                    ${formatPrice(price)}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="edit-btn"
                            onclick="openEditModal('${booking.id}')"
                        >
                            ✏️ تعديل
                        </button>

                        <button
                            class="delete-btn"
                            onclick="cancelBooking('${booking.id}')"
                        >
                            🗑️ إلغاء
                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "bookingCount"
    ).textContent =
        bookings.length;


    let total = 0;


    bookings.forEach(
        function(booking){

            total +=
                getPrice(
                    booking.booking_date,
                    getShift(booking)
                );

        }
    );


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatPrice(total);

}


/* =====================================================
   EDIT MODAL
===================================================== */

function openEditModal(
    id
){

    const booking =
        bookings.find(
            function(item){

                return String(
                    item.id
                ) === String(id);

            }
        );


    if(!booking){

        alert(
            "لم يتم العثور على الحجز."
        );

        return;
    }


    editingBookingId =
        id;


    document.getElementById(
        "editCustomerName"
    ).value =
        getCustomerName(
            booking
        );


    document.getElementById(
        "editPhone"
    ).value =
        booking.customer_phone ||
        "";


    document.getElementById(
        "editDate"
    ).value =
        booking.booking_date ||
        "";


    document.getElementById(
        "editFarm"
    ).value =
        getFarm(
            booking
        );


    document.getElementById(
        "editShift"
    ).value =
        getShift(
            booking
        );


    document.getElementById(
        "editModal"
    ).classList.add(
        "show"
    );

}


function closeEditModal(){

    editingBookingId =
        null;


    document.getElementById(
        "editModal"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

    if(!editingBookingId){

        return;
    }


    const customerName =
        document
        .getElementById(
            "editCustomerName"
        )
        .value
        .trim();


    const phone =
        document
        .getElementById(
            "editPhone"
        )
        .value
        .trim();


    const date =
        document
        .getElementById(
            "editDate"
        )
        .value;


    const farm =
        document
        .getElementById(
            "editFarm"
        )
        .value;


    const shift =
        document
        .getElementById(
            "editShift"
        )
        .value;


    if(
        !customerName ||
        !phone ||
        !date ||
        !farm ||
        !shift
    ){

        alert(
            "يرجى ملء جميع الحقول."
        );

        return;
    }


    const conflict =
        bookings.find(
            function(item){

                return (

                    String(item.id) !==
                    String(editingBookingId)

                    &&

                    item.booking_date === date

                    &&

                    getFarm(item) === farm

                    &&

                    getShift(item) === shift

                );

            }
        );


    if(conflict){

        alert(
            "هذا التاريخ والشفت محجوز مسبقاً."
        );

        return;
    }


    const updateData = {

        "Customer name":
            customerName,

        "customer_phone":
            phone,

        "booking_date":
            date,

        "Farm":
            farm,

        "Shift":
            shift

    };


    const {
        data,
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .update(
            updateData
        )
        .eq(
            "id",
            editingBookingId
        )
        .select()
        .single();


    if(error){

        console.error(
            "UPDATE ERROR:",
            error
        );

        showMessage(
            "فشل تعديل الحجز: " +
            error.message,
            "error"
        );

        return;
    }


    const index =
        bookings.findIndex(
            function(item){

                return String(
                    item.id
                ) === String(
                    editingBookingId
                );

            }
        );


    if(index !== -1){

        bookings[index] =
            data;

    }


    renderTable();

    updateStats();

    updateLastUpdate();

    closeEditModal();


    showMessage(
        "تم تعديل الحجز بنجاح ✅",
        "success"
    );

}


/* =====================================================
   CANCEL BOOKING
===================================================== */

async function cancelBooking(
    id
){

    const booking =
        bookings.find(
            function(item){

                return String(
                    item.id
                ) === String(id);

            }
        );


    if(!booking){

        alert(
            "لم يتم العثور على الحجز."
        );

        return;
    }


    const name =
        getCustomerName(
            booking
        );


    const farm =
        getFarm(
            booking
        );


    const shift =
        getShift(
            booking
        );


    const confirmed =
        confirm(

`هل أنت متأكد من إلغاء الحجز؟

الاسم:
${name}

المزرعة:
${farm}

التاريخ:
${booking.booking_date}

الشفت:
${shift}`

        );


    if(!confirmed){

        return;
    }


    const {
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        console.error(
            "DELETE ERROR:",
            error
        );

        showMessage(
            "فشل إلغاء الحجز: " +
            error.message,
            "error"
        );

        return;
    }


    bookings =
        bookings.filter(
            function(item){

                return String(
                    item.id
                ) !== String(id);

            }
        );


    renderTable();

    updateStats();

    updateLastUpdate();


    showMessage(
        "تم إلغاء الحجز بنجاح ✅",
        "success"
    );

}

        if(
