<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://xhyuqruymtengguoyaie.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_v_vOawF0sNtyj2YavPT6xw_u_zESPoI";


const BOOKINGS_TABLE =
    "BookingFarms";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let bookings = [];

let realtimeChannel = null;

let editingBookingId = null;

let audioContext = null;


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const errorBox =
        document.getElementById(
            "loginError"
        );


    errorBox.className =
        "login-error";


    if(!email || !password){

        errorBox.textContent =
            "اكتب البريد الإلكتروني وكلمة المرور.";

        errorBox.className =
            "login-error show";

        return;

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,

                password:password

            });


        if(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            errorBox.textContent =
                error.message ||
                "بيانات الدخول غير صحيحة.";

            errorBox.className =
                "login-error show";

            return;

        }


        if(
            !data ||
            !data.session
        ){

            errorBox.textContent =
                "لم يتم إنشاء جلسة دخول.";

            errorBox.className =
                "login-error show";

            return;

        }


        /*
         * تهيئة الصوت بعد ضغطة المستخدم
         */
        initAudio();


        showAdmin();

    }

    catch(error){

        console.error(error);

        errorBox.textContent =
            "حدث خطأ أثناء تسجيل الدخول.";

        errorBox.className =
            "login-error show";

    }

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth
            .getSession();


        if(error){

            console.error(error);

            showLogin();

            return;

        }


        if(
            data &&
            data.session
        ){

            initAudio();

            showAdmin();

        }
        else{

            showLogin();

        }

    }

    catch(error){

        console.error(error);

        showLogin();

    }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

    document.getElementById(
        "loginPage"
    ).style.display =
        "flex";


    document.getElementById(
        "adminPage"
    ).style.display =
        "none";

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

    document.getElementById(
        "loginPage"
    ).style.display =
        "none";


    document.getElementById(
        "adminPage"
    ).style.display =
        "block";


    loadBookings();

    startRealtime();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    if(realtimeChannel){

        await supabaseClient
        .removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }


    await supabaseClient.auth.signOut();

    bookings = [];

    showLogin();

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message show " +
        type;


    setTimeout(
        function(){

            box.className =
                "message";

        },
        3500
    );

}


/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

    try{

        if(!audioContext){

            const AudioContext =
                window.AudioContext ||
                window.webkitAudioContext;

            if(AudioContext){

                audioContext =
                    new AudioContext();

            }

        }


        if(
            audioContext &&
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }

    catch(error){

        console.log(
            "Audio unavailable",
            error
        );

    }

}


function playNotificationSound(){

    try{

        if(!audioContext){

            initAudio();

        }


        if(!audioContext){

            return;

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }


        const now =
            audioContext.currentTime;


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(
            880,
            now
        );


        oscillator.frequency.setValueAtTime(
            660,
            now + 0.15
        );


        oscillator.frequency.setValueAtTime(
            880,
            now + 0.30
        );


        gain.gain.setValueAtTime(
            0.0001,
            now
        );


        gain.gain.exponentialRampToValueAtTime(
            0.25,
            now + 0.03
        );


        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            now + 0.50
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start(now);

        oscillator.stop(
            now + 0.55
        );

    }

    catch(error){

        console.log(
            "Sound error:",
            error
        );

    }

}


/* =====================================================
   BROWSER NOTIFICATIONS
===================================================== */

async function enableNotifications(){

    if(
        !("Notification" in window)
    ){

        alert(
            "المتصفح الحالي لا يدعم إشعارات المتصفح."
        );

        return;

    }


    try{

        const permission =
            await Notification.requestPermission();


        if(
            permission ===
            "granted"
        ){

            showMessage(
                "تم تفعيل إشعارات الحجوزات 🔔",
                "success"
            );


            new Notification(
                "مزارع الغيث",
                {
                    body:
                    "تم تفعيل إشعارات الحجوزات بنجاح."
                }
            );

        }
        else{

            showMessage(
                "لم يتم السماح بالإشعارات.",
                "error"
            );

        }

    }

    catch(error){

        console.error(error);

    }

}


/* =====================================================
   SHOW NEW BOOKING NOTIFICATION
===================================================== */

function notifyNewBooking(
    booking
){

    const name =
        getCustomerName(
            booking
        ) ||
        "زبون جديد";


    const farm =
        getFarm(
            booking
        ) ||
        "-";


    const shift =
        getShift(
            booking
        ) ||
        "-";


    const date =
        booking.booking_date ||
        "-";


    /*
     * صوت
     */
    playNotificationSound();


    /*
     * داخل الصفحة
     */

    document.getElementById(
        "alertCustomer"
    ).textContent =
        "👤 " + name;


    document.getElementById(
        "alertDetails"
    ).textContent =
        "📅 " +
        date +
        " | " +
        farm +
        " | " +
        shift;


    document.getElementById(
        "newBookingAlert"
    ).classList.add(
        "show"
    );


    /*
     * إشعار المتصفح
     */

    if(
        "Notification" in window &&
        Notification.permission ===
        "granted"
    ){

        try{

            new Notification(
                "🔔 حجز جديد - مزارع الغيث",
                {
                    body:
                    name +
                    "\n" +
                    date +
                    " - " +
                    farm +
                    " - " +
                    shift,

                    tag:
                    "algaith-new-booking"
                }
            );

        }

        catch(error){

            console.log(
                "Browser notification error:",
                error
            );

        }

    }


    /*
     * رسالة داخل لوحة الإدارة
     */

    showMessage(
        "🔔 تم استلام حجز جديد من " +
        name,
        "success"
    );


    /*
     * إغلاق التنبيه تلقائياً
     */

    setTimeout(
        function(){

            closeBookingAlert();

        },
        10000
    );

}


function closeBookingAlert(){

    document.getElementById(
        "newBookingAlert"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   REALTIME
===================================================== */

function startRealtime(){

    /*
     * منع إنشاء أكثر من قناة
     */

    if(realtimeChannel){

        return;

    }


    realtimeChannel =
        supabaseClient
        .channel(
            "bookingfarms-realtime"
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:BOOKINGS_TABLE
            },
            function(payload){

                console.log(
                    "NEW BOOKING:",
                    payload
                );


                /*
                 * إذا الحجز موجود مسبقاً
                 * لا نكرره
                 */

                const exists =
                    bookings.some(
                        function(item){

                            return String(
                                item.id
                            ) === String(
                                payload.new.id
                            );

                        }
                    );


                if(!exists){

                    bookings.push(
                        payload.new
                    );

                }


                renderTable();

                updateStats();

                updateLastUpdate();


                notifyNewBooking(
                    payload.new
                );

            }
        )
        .on(
            "postgres_changes",
            {
                event:"UPDATE",
                schema:"public",
                table:BOOKINGS_TABLE
            },
            function(payload){

                console.log(
                    "BOOKING UPDATED:",
                    payload
                );


                const index =
                    bookings.findIndex(
                        function(item){

                            return String(
                                item.id
                            ) === String(
                                payload.new.id
                            );

                        }
                    );


                if(index !== -1){

                    bookings[index] =
                        payload.new;

                }
                else{

                    bookings.push(
                        payload.new
                    );

                }


                renderTable();

                updateStats();

                updateLastUpdate();


                showMessage(
                    "✏️ تم تحديث حجز",
                    "success"
                );

            }
        )
        .on(
            "postgres_changes",
            {
                event:"DELETE",
                schema:"public",
                table:BOOKINGS_TABLE
            },
            function(payload){

                console.log(
                    "BOOKING DELETED:",
                    payload
                );


                bookings =
                    bookings.filter(
                        function(item){

                            return String(
                                item.id
                            ) !== String(
                                payload.old.id
                            );

                        }
                    );


                renderTable();

                updateStats();

                updateLastUpdate();


                showMessage(
                    "🗑️ تم إلغاء حجز",
                    "success"
                );

            }
        )
        .subscribe(
            function(status){

                console.log(
                    "Realtime status:",
                    status
                );

            }
        );

}


/* =====================================================
   LOAD BOOKINGS
===================================================== */

async function loadBookings(){

    const {
        data,
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .select("*")
        .order(
            "booking_date",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        showMessage(
            "حدث خطأ أثناء تحميل الحجوزات: " +
            error.message,
            "error"
        );

        return;

    }


    bookings =
        data || [];


    renderTable();

    updateStats();

    updateLastUpdate();

}


/* =====================================================
   UPDATE LAST UPDATE
===================================================== */

function updateLastUpdate(){

    document.getElementById(
        "lastUpdate"
    ).textContent =
        new Date().toLocaleTimeString(
            "ar-IQ"
        );

}


/* =====================================================
   GET CUSTOMER NAME
===================================================== */

function getCustomerName(
    booking
){

    return (
        booking["Customer name"] ||
        booking["customer_name"] ||
        ""
    );

}


/* =====================================================
   GET FARM
===================================================== */

function getFarm(
    booking
){

    return (
        booking["Farm"] ||
        booking["farm"] ||
        ""
    );

}


/* =====================================================
   GET SHIFT
===================================================== */

function getShift(
    booking
){

    return (
        booking["Shift"] ||
        booking["shift"] ||
        ""
    );

}


/* =====================================================
   PRICE
===================================================== */

function getPrice(
    date,
    shift
){

    if(!date){

        return 0;

    }


    const parts =
        String(date).split("-");


    const dateObject =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );


    const day =
        dateObject.getDay();


    /*
        الخميس = 4
        الجمعة = 5
        السبت = 6
    */

    const expensiveDays =
        day === 4 ||
        day === 5 ||
        day === 6;


    if(expensiveDays){

        if(
            shift ===
            "شفت صباحي"
        ){

            return 350000;

        }


        if(
            shift ===
            "شفت مسائي"
        ){

            return 400000;

        }

    }


    if(
        shift ===
        "شفت صباحي"
    ){

        return 250000;

    }


    if(
        shift ===
        "شفت مسائي"
    ){

        return 300000;

    }


    return 0;

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(
    price
){

    return (
        Number(price)
        .toLocaleString("en-US")
        +
        " د.ع"
    );

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

    const tbody =
        document.getElementById(
            "bookingTable"
        );


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const date =
        document
        .getElementById("dateFilter")
        .value;


    const farm =
        document
        .getElementById("farmFilter")
        .value;


    const shift =
        document
        .getElementById("shiftFilter")
        .value;


    const filtered =
        bookings.filter(
            function(booking){

                const name =
                    getCustomerName(
                        booking
                    )
                    .toLowerCase();


                const phone =
                    String(
                        booking.customer_phone || ""
                    )
                    .toLowerCase();


                const bookingFarm =
                    getFarm(
                        booking
                    );


                const bookingShift =
                    getShift(
                        booking
                    );


                const matchSearch =
                    !search ||
                    name.includes(search) ||
                    phone.includes(search);


                const matchDate =
                    !date ||
                    booking.booking_date === date;


                const matchFarm =
                    !farm ||
                    bookingFarm === farm;


                const matchShift =
                    !shift ||
                    bookingShift === shift;


                return (
                    matchSearch &&
                    matchDate &&
                    matchFarm &&
                    matchShift
                );

            }
        );


    tbody.innerHTML = "";


    if(
        filtered.length === 0
    ){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    لا توجد حجوزات
                </td>

            </tr>

        `;

        return;

    }


    /*
     * ترتيب الأحدث أولاً
     */

    filtered.sort(
        function(a,b){

            return String(
                b.created_at || ""
            ).localeCompare(
                String(
                    a.created_at || ""
                )
            );

        }
    );


    filtered.forEach(
        function(
            booking,
            index
        ){

            const bookingShift =
                getShift(
                    booking
                );


            const price =
                getPrice(
                    booking.booking_date,
                    bookingShift
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${booking.booking_date || "-"}
                </td>

                <td>
                    ${getFarm(booking) || "-"}
                </td>

                <td>
                    ${
                        bookingShift ===
                        "شفت صباحي"

                        ? "☀️ صباحي"

                        : "🌙 مسائي"
                    }
                </td>

                <td>
                    ${getCustomerName(booking) || "-"}
                </td>

                <td>
                    ${booking.customer_phone || "-"}
                </td>

                <td class="price">
                    ${formatPrice(price)}
                </td>

                <td>

                    <div class="action-buttons">

                        <button
                            class="edit-btn"
                            onclick="openEditModal('${booking.id}')"
                        >
                            ✏️ تعديل
                        </button>

                        <button
                            class="delete-btn"
                            onclick="cancelBooking('${booking.id}')"
                        >
                            🗑️ إلغاء
                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(
                tr
            );

        }
    );

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "bookingCount"
    ).textContent =
        bookings.length;


    let total = 0;


    bookings.forEach(
        function(booking){

            total +=
                getPrice(
                    booking.booking_date,
                    getShift(booking)
                );

        }
    );


    document.getElementById(
        "totalAmount"
    ).textContent =
        formatPrice(total);

}


/* =====================================================
   OPEN EDIT MODAL
===================================================== */

function openEditModal(
    id
){

    const booking =
        bookings.find(
            function(item){

                return String(
                    item.id
                ) === String(id);

            }
        );


    if(!booking){

        alert(
            "لم يتم العثور على الحجز."
        );

        return;

    }


    editingBookingId =
        id;


    document.getElementById(
        "editCustomerName"
    ).value =
        getCustomerName(
            booking
        );


    document.getElementById(
        "editPhone"
    ).value =
        booking.customer_phone ||
        "";


    document.getElementById(
        "editDate"
    ).value =
        booking.booking_date ||
        "";


    document.getElementById(
        "editFarm"
    ).value =
        getFarm(
            booking
        );


    document.getElementById(
        "editShift"
    ).value =
        getShift(
            booking
        );


    document.getElementById(
        "editModal"
    ).classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE EDIT MODAL
===================================================== */

function closeEditModal(){

    editingBookingId =
        null;


    document.getElementById(
        "editModal"
    ).classList.remove(
        "show"
    );

}


/* =====================================================
   SAVE EDIT
===================================================== */

async function saveEdit(){

    if(!editingBookingId){

        return;

    }


    const customerName =
        document
        .getElementById(
            "editCustomerName"
        )
        .value
        .trim();


    const phone =
        document
        .getElementById(
            "editPhone"
        )
        .value
        .trim();


    const date =
        document
        .getElementById(
            "editDate"
        )
        .value;


    const farm =
        document
        .getElementById(
            "editFarm"
        )
        .value;


    const shift =
        document
        .getElementById(
            "editShift"
        )
        .value;


    if(
        !customerName ||
        !phone ||
        !date ||
        !farm ||
        !shift
    ){

        alert(
            "يرجى ملء جميع الحقول."
        );

        return;

    }


    /*
     * منع تعديل الحجز إلى شفت
     * محجوز من شخص آخر
     */

    const conflict =
        bookings.find(
            function(item){

                return (
                    String(item.id) !==
                    String(editingBookingId)
                    &&
                    item.booking_date === date
                    &&
                    getFarm(item) === farm
                    &&
                    getShift(item) === shift
                );

            }
        );


    if(conflict){

        alert(
            "هذا التاريخ والشفت محجوز مسبقاً."
        );

        return;

    }


    const updateData = {

        "Customer name":
            customerName,

        "customer_phone":
            phone,

        "booking_date":
            date,

        "Farm":
            farm,

        "Shift":
            shift

    };


    const {
        data,
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .update(
            updateData
        )
        .eq(
            "id",
            editingBookingId
        )
        .select()
        .single();


    if(error){

        console.error(
            "UPDATE ERROR:",
            error
        );

        showMessage(
            "فشل تعديل الحجز: " +
            error.message,
            "error"
        );

        return;

    }


    const index =
        bookings.findIndex(
            function(item){

                return String(
                    item.id
                ) === String(
                    editingBookingId
                );

            }
        );


    if(index !== -1){

        bookings[index] =
            data;

    }


    renderTable();

    updateStats();

    updateLastUpdate();


    closeEditModal();


    showMessage(
        "تم تعديل الحجز بنجاح ✅",
        "success"
    );

}


/* =====================================================
   CANCEL BOOKING
===================================================== */

async function cancelBooking(
    id
){

    const booking =
        bookings.find(
            function(item){

                return String(
                    item.id
                ) === String(id);

            }
        );


    if(!booking){

        alert(
            "لم يتم العثور على الحجز."
        );

        return;

    }


    const name =
        getCustomerName(
            booking
        );


    const farm =
        getFarm(
            booking
        );


    const shift =
        getShift(
            booking
        );


    const confirmed =
        confirm(

`هل أنت متأكد من إلغاء الحجز؟

الاسم:
${name}

المزرعة:
${farm}

التاريخ:
${booking.booking_date}

الشفت:
${shift}`

        );


    if(!confirmed){

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from(BOOKINGS_TABLE)
        .delete()
        .eq(
            "id",
            id
        );


    if(error){

        console.error(
            "DELETE ERROR:",
            error
        );

        showMessage(
            "فشل إلغاء الحجز: " +
            error.message,
            "error"
        );

        return;

    }


    bookings =
        bookings.filter(
            function(item){

                return String(
                    item.id
                ) !== String(id);

            }
        );


    renderTable();

    updateStats();

    updateLastUpdate();


    showMessage(
        "تم إلغاء الحجز بنجاح ✅",
        "success"
    );

}
